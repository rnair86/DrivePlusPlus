%dev.grafana.endpoint=http://localhost:3000
%dev.otel-collector.url=http://localhost:4317

# PostgreSQL Connection (Disables Dev Services for Databases)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/identity
quarkus.datasource.username=identity
quarkus.datasource.password=identity123

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.http.port=8080
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.security-scheme=jwt
%test.quarkus.http.test-port=0

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=user-service
quarkus.oidc.tenant-enabled=false

quarkus.http.auth.permission.public-meta.paths=/q/*
quarkus.http.auth.permission.public-meta.policy=permit
quarkus.http.auth.permission.public-login.paths=/api/v1/auth/login
quarkus.http.auth.permission.public-login.methods=POST
quarkus.http.auth.permission.public-login.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# JWT signing key used by SmallRyeTokenIssuer
smallrye.jwt.sign.key.location=privateKey.pem

# RabbitMQ Connection (Disables Dev Services for RabbitMQ)
mp.messaging.outgoing.dpp-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.dpp-events-out.host=${RABBITMQ_HOST:localhost}
mp.messaging.outgoing.dpp-events-out.port=5672
mp.messaging.outgoing.dpp-events-out.username=application_user
mp.messaging.outgoing.dpp-events-out.password=AppPassword123
mp.messaging.outgoing.dpp-events-out.exchange.name=dpp.events
mp.messaging.outgoing.dpp-events-out.exchange.declare=false
# add exchange/routing settings your app expects
# mp.messaging.outgoing.ds-events-out.exchange.name=...

#quarkus.rabbitmq-client.host=${RABBITMQ_HOST:localhost}
#quarkus.rabbitmq-client.port=5672
#quarkus.smallrye-rabbitmq.host=${RABBITMQ_HOST:localhost}
#quarkus.smallrye-rabbitmq.port=5672
#quarkus.rabbitmq-client.username=application_user
#quarkus.rabbitmq-client.password=AppPassword123
#
# Global connection properties
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=5672
rabbitmq-username=application_user
rabbitmq-password=AppPassword123
