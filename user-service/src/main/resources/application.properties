%dev.grafana.endpoint=http://localhost:3000
%dev.otel-collector.url=http://localhost:4317

# PostgreSQL Connection (Disables Dev Services for Databases)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/identity
quarkus.datasource.username=identity
quarkus.datasource.password=identity123

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# JWT signing key used by SmallRyeTokenIssuer
smallrye.jwt.sign.key.location=privateKey.pem

# RabbitMQ Connection (Disables Dev Services for RabbitMQ)
mp.messaging.outgoing.ds-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.ds-events-out.host=localhost
mp.messaging.outgoing.ds-events-out.port=5672
mp.messaging.outgoing.ds-events-out.username=application_user
mp.messaging.outgoing.ds-events-out.password=AppPassword123
# add exchange/routing settings your app expects
# mp.messaging.outgoing.ds-events-out.exchange.name=...

