# docker-compose.infrastructure.yml
# DOCKERFILE TO CREATE A LOCAL DEVELOPMENT ENVIRONMENT FOR THE DPP PROJECT
name: dpp_local_infrastructure
services:
  postgres:
    image: postgres:18
    container_name: dpp_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: identity,appointment,course,test,payment,notification,preferences
    ports: ["5432:5432"]
    volumes:
      - ./db-bootstrap:/docker-entrypoint-initdb.d   # bootstrap script runs automatically on first container start
      - pgdata:/var/lib/postgresql
  rabbitmq:
    image: rabbitmq:4-management
    container_name: dpp_rabbitmq
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq
# Named volumes live on the Linux filesystem inside Docker, so chmod works.
# `docker compose down` keeps them. `docker compose down -v` deletes them.
# A folder on D: cannot be used: Windows bind mounts stay mode 777 and both
# Postgres and RabbitMQ refuse to start.
volumes:
  pgdata:
    name: local_pgdata
  rabbitmq_data:
    name: local_rabbitmq_data