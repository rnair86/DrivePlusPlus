%dev.grafana.endpoint=http://localhost:3000
%dev.otel-collector.url=http://localhost:4317

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/payment
quarkus.datasource.username=payment
quarkus.datasource.password=payment123

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.http.port=8084
quarkus.swagger-ui.always-include=true
%test.quarkus.http.test-port=0

mp.messaging.outgoing.dpp-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.dpp-events-out.host=${RABBITMQ_HOST:localhost}
mp.messaging.outgoing.dpp-events-out.port=5672
mp.messaging.outgoing.dpp-events-out.username=payment_user
mp.messaging.outgoing.dpp-events-out.password=PaymentPassword123
mp.messaging.outgoing.dpp-events-out.exchange.name=dpp.events
mp.messaging.outgoing.dpp-events-out.exchange.declare=false

mp.messaging.incoming.course-enrollment-events.connector=smallrye-rabbitmq
mp.messaging.incoming.course-enrollment-events.host=${RABBITMQ_HOST:localhost}
mp.messaging.incoming.course-enrollment-events.port=5672
mp.messaging.incoming.course-enrollment-events.username=payment_user
mp.messaging.incoming.course-enrollment-events.password=PaymentPassword123
mp.messaging.incoming.course-enrollment-events.queue.name=payment.q.enrollment-events
mp.messaging.incoming.course-enrollment-events.exchange.declare=false
mp.messaging.incoming.course-enrollment-events.queue.declare=false

rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=5672
rabbitmq-username=payment_user
rabbitmq-password=PaymentPassword123
