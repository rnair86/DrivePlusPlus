%dev.grafana.endpoint=http://localhost:3000
%dev.otel-collector.url=http://localhost:4317

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/course
quarkus.datasource.username=course
quarkus.datasource.password=course123

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.http.port=8081
quarkus.swagger-ui.always-include=true
%test.quarkus.http.test-port=0

mp.messaging.outgoing.dpp-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.dpp-events-out.host=${RABBITMQ_HOST:localhost}
mp.messaging.outgoing.dpp-events-out.port=5672
mp.messaging.outgoing.dpp-events-out.username=course_user
mp.messaging.outgoing.dpp-events-out.password=CoursePassword123
mp.messaging.outgoing.dpp-events-out.exchange.name=dpp.events
mp.messaging.outgoing.dpp-events-out.exchange.declare=false

rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=5672
rabbitmq-username=course_user
rabbitmq-password=CoursePassword123
