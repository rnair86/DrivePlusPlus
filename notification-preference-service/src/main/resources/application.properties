%dev.grafana.endpoint=http://localhost:3000
%dev.otel-collector.url=http://localhost:4317

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/preferences
quarkus.datasource.username=preferences
quarkus.datasource.password=preferences123

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.http.port=8085
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.security-scheme=jwt
%test.quarkus.http.test-port=0

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=user-service
quarkus.oidc.tenant-enabled=false

quarkus.http.auth.permission.public-meta.paths=/q/*
quarkus.http.auth.permission.public-meta.policy=permit
quarkus.http.auth.permission.public-login.paths=/api/v1/auth/login
quarkus.http.auth.permission.public-login.methods=POST
quarkus.http.auth.permission.public-login.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

mp.messaging.outgoing.dpp-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.dpp-events-out.host=${RABBITMQ_HOST:localhost}
mp.messaging.outgoing.dpp-events-out.port=5672
mp.messaging.outgoing.dpp-events-out.username=preferences_user
mp.messaging.outgoing.dpp-events-out.password=PreferencesPassword123
mp.messaging.outgoing.dpp-events-out.exchange.name=dpp.events
mp.messaging.outgoing.dpp-events-out.exchange.declare=false

mp.messaging.incoming.user-events.connector=smallrye-rabbitmq
mp.messaging.incoming.user-events.host=${RABBITMQ_HOST:localhost}
mp.messaging.incoming.user-events.port=5672
mp.messaging.incoming.user-events.username=preferences_user
mp.messaging.incoming.user-events.password=PreferencesPassword123
mp.messaging.incoming.user-events.queue.name=preferences.q.user-events
mp.messaging.incoming.user-events.exchange.declare=false
mp.messaging.incoming.user-events.queue.declare=false

rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=5672
rabbitmq-username=preferences_user
rabbitmq-password=PreferencesPassword123
